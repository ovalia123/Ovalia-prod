{% extends "base.html" %}
{% load static %}
{% block content %}

<style>

/* GLOBAL */
.contact-section{
    font-family:"Playfair Display", serif;
    background:#fff;
    color:#000;
    padding:100px 8%;
}

/* GRID */
.contact-wrap{
    display:grid;
    grid-template-columns:1.2fr 1fr;
    gap:80px;
    align-items:center;
}

/* IMAGE */
.contact-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TITLE */
.contact-title{
    text-transform:uppercase;
    font-size:42px;
    margin-bottom:40px;
    letter-spacing:3px;
}

/* TEXT */
.contact-info p{
    text-transform:lowercase;
    font-size:18px;
    margin-bottom:25px;
    line-height:1.7;
}

/* LABELS */
.contact-info strong{
    display:block;
    text-transform:uppercase;
    font-size:14px;
    letter-spacing:2px;
    margin-bottom:6px;
}

/* SOCIAL */
.social a{
    color:#000;
    text-decoration:none;
    margin-right:25px;
    border-bottom:1px solid #000;
    padding-bottom:2px;
}

.social a:hover{
    opacity:.6;
}

/* RESPONSIVE */
@media(max-width:900px){
    .contact-wrap{
        grid-template-columns:1fr;
    }

    .contact-img img{
        height:420px;
    }
}

</style>

<section class="contact-section">

<div class="contact-wrap">

    <!-- IMAGE LEFT -->
    <div class="contact-img">
        <img src="{% static 'images/IMG_8336.JPG' %}" alt="boutique ovalia">
    </div>

    <!-- TEXT RIGHT -->
    <div class="contact-info">

        <h1 class="contact-title">nous contacter</h1>

        <p>
            <strong>telephone</strong>
            514-746-5469
        </p>

        <p>
            <strong>courriel</strong>
            infoovaliabijoux@gmail.com
        </p>

        <p>
            <strong>adresse boutique</strong>
            40 rue saint-joseph<br>
            sainte-thérèse, qc, j7e 3l6
        </p>

        <p>
            <strong>reseaux sociaux</strong>
            <span class="social">
                <a href="https://www.instagram.com/ovaliabijoux/?hl=fr">Instagram</a>
                <a href="https://www.tiktok.com/@ovaliabijoux">Tiktok</a>
                <a href="https://www.facebook.com/OvaliaBijoux/?locale=fr_FR">Facebook</a>
            </span>
        </p>

    </div>

</div>
</section>

{% endblock %}
